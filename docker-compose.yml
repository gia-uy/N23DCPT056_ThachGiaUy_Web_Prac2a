services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: products_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-postgres:
    image: postgres:16
    container_name: auth-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: orders_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/products_db
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: product-service
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
       condition: service_started

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    environment:
      MONGODB_URI: mongodb://admin:secret@mongo:27017/orders_db?authSource=admin
      NODE_ENV: production
      PORT: 3002
      SERVICE_NAME: order-service
    ports:
      - "3002:3002"
    depends_on:
      - mongo
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      ALLOWED_ORIGINS: "*"
    ports:
      - "3000:3000"
    depends_on:
      - product-service
      - order-service

volumes:
  postgres_data:
  mongo_data:
  auth_postgres_data: